services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CDN_URL: ${VITE_CDN_URL}
    image: ghcr.io/donyaelmo/film-react-nest-frontend:latest
    restart: unless-stopped
    volumes:
      - frontend:/frontend-dist
    healthcheck:
      test: ["CMD-SHELL", "test -f /frontend-dist/index.html"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  backend:
    build: ./backend
    image: ghcr.io/donyaelmo/film-react-nest-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_DRIVER: postgres
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  server:
    build: ./nginx
    image: ghcr.io/donyaelmo/film-react-nest-server:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend:/var/www/html:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - internal

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - database
    networks:
      - internal

volumes:
  frontend:
  database:
  pgadmin:

networks:
  internal: